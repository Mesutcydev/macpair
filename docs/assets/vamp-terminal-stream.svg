<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Vamp Terminal streamed command cards</title>
  <desc id="desc">A dark transparent-glass task chat showing a permission card, streamed terminal output, and a completed command.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252525" stop-opacity=".98"/>
      <stop offset="1" stop-color="#111111" stop-opacity=".98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="860" rx="34" fill="#0a0a0a"/>
  <path d="M0 132h1280M0 196h1280" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="38" cy="33" r="6" fill="#777"/><circle cx="58" cy="33" r="6" fill="#555"/><circle cx="78" cy="33" r="6" fill="#333"/>
  <text x="108" y="40" fill="#e9e9e6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="19" font-weight="700">Vamp Terminal</text>
  <text x="1080" y="39" fill="#9c9c97" font-family="ui-monospace,monospace" font-size="14">● connected</text>
  <text x="36" y="101" fill="#f1f1ee" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="24" font-weight="700">Task chat</text>
  <text x="36" y="121" fill="#85857f" font-family="ui-monospace,monospace" font-size="13">stream view · approval boundary visible</text>
  <g transform="translate(36 155)">
    <rect width="1208" height="54" rx="13" fill="#181818" stroke="#fff" stroke-opacity=".13"/>
    <rect x="12" y="10" width="110" height="34" rx="9" fill="#303030" stroke="#fff" stroke-opacity=".19"/>
    <text x="31" y="32" fill="#f1f1ee" font-family="ui-monospace,monospace" font-size="14">work</text>
    <rect x="132" y="10" width="122" height="34" rx="9" fill="#222" stroke="#fff" stroke-opacity=".09"/>
    <text x="153" y="32" fill="#92928c" font-family="ui-monospace,monospace" font-size="14">agent</text>
    <rect x="264" y="10" width="110" height="34" rx="9" fill="#222" stroke="#fff" stroke-opacity=".09"/>
    <text x="285" y="32" fill="#92928c" font-family="ui-monospace,monospace" font-size="14">logs</text>
    <text x="1140" y="33" fill="#8f8f89" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="21">+</text>
  </g>
  <g transform="translate(36 237)" filter="url(#shadow)">
    <rect width="584" height="232" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".17"/>
    <text x="24" y="32" fill="#a4a49e" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15">Permission required</text>
    <text x="24" y="58" fill="#6f6f69" font-family="ui-monospace,monospace" font-size="13">AWAITING APPROVAL</text>
    <rect x="24" y="77" width="536" height="68" rx="11" fill="#0d0d0d" stroke="#fff" stroke-opacity=".1"/>
    <text x="42" y="105" fill="#e5e5e1" font-family="ui-monospace,monospace" font-size="15">$ git pull --ff-only</text>
    <text x="42" y="130" fill="#777771" font-family="ui-monospace,monospace" font-size="13">No output yet.</text>
    <rect x="24" y="164" width="90" height="38" rx="9" fill="#ededeb"/>
    <text x="47" y="188" fill="#101010" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">Allow</text>
    <rect x="124" y="164" width="168" height="38" rx="9" fill="#2e2e2e" stroke="#fff" stroke-opacity=".16"/>
    <text x="141" y="188" fill="#d5d5d1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Always allow here</text>
    <rect x="302" y="164" width="76" height="38" rx="9" fill="#202020" stroke="#fff" stroke-opacity=".11"/>
    <text x="324" y="188" fill="#a7a7a1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">Deny</text>
  </g>
  <g transform="translate(660 237)" filter="url(#shadow)">
    <rect width="584" height="232" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".17"/>
    <text x="24" y="32" fill="#a4a49e" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15">Command stream</text>
    <text x="24" y="58" fill="#bdbdb8" font-family="ui-monospace,monospace" font-size="13">RUNNING · work</text>
    <rect x="24" y="77" width="536" height="124" rx="11" fill="#0d0d0d" stroke="#fff" stroke-opacity=".1"/>
    <text x="42" y="105" fill="#e5e5e1" font-family="ui-monospace,monospace" font-size="14">remote: Enumerating objects...</text>
    <text x="42" y="130" fill="#b9b9b4" font-family="ui-monospace,monospace" font-size="14">remote: Counting objects: 42%</text>
    <text x="42" y="155" fill="#8d8d87" font-family="ui-monospace,monospace" font-size="14">Receiving objects: 100%</text>
    <text x="42" y="180" fill="#ededeb" font-family="ui-monospace,monospace" font-size="14">▌</text>
  </g>
  <g transform="translate(36 499)" filter="url(#shadow)">
    <rect width="1208" height="184" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".17"/>
    <circle cx="31" cy="32" r="8" fill="none" stroke="#d9d9d5" stroke-width="2"/><path d="m27 32 3 3 6-7" fill="none" stroke="#d9d9d5" stroke-width="2" stroke-linecap="round"/>
    <text x="55" y="37" fill="#eeeeea" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700">Completed · 1.8s</text>
    <text x="55" y="62" fill="#85857f" font-family="ui-monospace,monospace" font-size="13">git pull --ff-only</text>
    <rect x="24" y="82" width="1160" height="73" rx="11" fill="#0d0d0d" stroke="#fff" stroke-opacity=".1"/>
    <text x="42" y="111" fill="#c9c9c4" font-family="ui-monospace,monospace" font-size="14">Already up to date.</text>
    <text x="42" y="137" fill="#73736d" font-family="ui-monospace,monospace" font-size="13">worktree clean · output retained in the tab</text>
  </g>
  <rect x="36" y="728" width="1208" height="66" rx="14" fill="#181818" stroke="#fff" stroke-opacity=".14"/>
  <text x="61" y="768" fill="#777771" font-family="ui-monospace,monospace" font-size="15">Type a command to review…</text>
  <circle cx="1195" cy="761" r="20" fill="#ededeb"/><path d="m1188 761h14m-6-6 6 6-6 6" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
