name: ScreenHarbor

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ScreenHarborCore:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.15.0

fileGroups:
  - docs/xcode-security-settings.md

settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_ENHANCED_SECURITY: YES
    ENABLE_POINTER_AUTHENTICATION: NO
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    CLANG_WARN_IMPLICIT_FALLTHROUGH: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_TREAT_IMPLICIT_FUNCTION_DECLARATIONS_AS_ERRORS: YES
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES

targets:
  ScreenHarborHost:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/HostApp
        excludes:
          - Assets.xcassets
      - path: Sources/HostWidgetShared
      - path: Sources/SharedUI
      - path: ScreenHarbor/Resources/Assets.xcassets
    info:
      path: ScreenHarbor/Resources/ScreenHarborHost-Info.plist
      properties:
        CFBundleDisplayName: ScreenHarbor Host
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 ScreenHarbor contributors."
        NSLocalNetworkUsageDescription: "ScreenHarbor Host advertises on your local network so approved clients can discover and connect to this Mac."
        NSBonjourServices:
          - _screenharbor._tcp
          - _screenharbor._tcp.
        CFBundleURLTypes:
          - CFBundleURLName: uk.mesut.screenharbor.host
            CFBundleURLSchemes:
              - screenharbor
    settings:
      base:
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 3
        PRODUCT_BUNDLE_IDENTIFIER: uk.mesut.screenharbor.host
        PRODUCT_NAME: ScreenHarbor Host
        INFOPLIST_FILE: ScreenHarbor/Resources/ScreenHarborHost-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ScreenHarbor/Resources/ScreenHarborHost.entitlements
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        OTHER_LDFLAGS: "$(inherited) -framework AppIntents"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ScreenHarborCore
        product: SharedModels
      - package: ScreenHarborCore
        product: SharedProtocol
      - package: ScreenHarborCore
        product: SharedUtilities
      - package: ScreenHarborCore
        product: CaptureEngine
      - package: ScreenHarborCore
        product: EncodeEngine
      - package: ScreenHarborCore
        product: TransportWebRTC
      - package: ScreenHarborCore
        product: InputControl
      - package: ScreenHarborCore
        product: Permissions
      - package: ScreenHarborCore
        product: Discovery
      - package: ScreenHarborCore
        product: Diagnostics

  ScreenHarborClient:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MacClient/Sources
      - path: MacClient/Resources/PrivacyInfo.xcprivacy
      - path: ScreenHarbor/Resources/Assets.xcassets
      - path: Sources/SharedUI
      - path: Sources/ClientiOS
        includes:
          - AppHaptics.swift
          - BonjourWakeService.swift
          - ClientAppEnvironment.swift
          - ClientAudioRenderer.swift
          - ClientClipboardSyncManager.swift
          - ClientFileTransferManager.swift
          - ClientHostBlockedState.swift
          - ClientReconnectCoordinator.swift
          - ClientSessionCoordinator.swift
          - ClientSettingsSyncService.swift
          - ClientTerminalSessionManager.swift
          - ClientTrustedHostsViewModel.swift
          - CrashSafeStartupDiagnostics.swift
          - DisplayLayoutViewModel.swift
          - HostsListViewModel.swift
          - Models/Display.swift
          - Models/Host.swift
          - Models/Session.swift
          - RemoteDisplayViewModel.swift
          - SessionStatsViewModel.swift
          - VideoFrameDecoderView.swift
          - WakeCoordinator.swift
          - WakeOnLANService.swift
      - path: Sources/ClientiOS/Localizable.xcstrings
    info:
      path: ScreenHarbor/Resources/ScreenHarborClient-Info.plist
      properties:
        CFBundleDisplayName: ScreenHarbor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 ScreenHarbor contributors."
        NSLocalNetworkUsageDescription: "ScreenHarbor uses your local network to discover and connect to Macs running ScreenHarbor Host."
        NSBonjourServices:
          - _screenharbor._tcp
          - _screenharbor._tcp.
    settings:
      base:
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 3
        PRODUCT_BUNDLE_IDENTIFIER: uk.mesut.screenharbor.client
        PRODUCT_NAME: ScreenHarbor
        INFOPLIST_FILE: ScreenHarbor/Resources/ScreenHarborClient-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ScreenHarbor/Resources/ScreenHarborClient.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECTDIST"
    dependencies:
      - package: ScreenHarborCore
        product: SharedModels
      - package: ScreenHarborCore
        product: SharedProtocol
      - package: ScreenHarborCore
        product: SharedUtilities
      - package: ScreenHarborCore
        product: TransportWebRTC
      - package: ScreenHarborCore
        product: Discovery
      - package: ScreenHarborCore
        product: Diagnostics
      - package: ScreenHarborCore
        product: Permissions
      - package: SwiftTerm
        product: SwiftTerm

  ScreenHarborTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: MacClient/Tests
      - path: MacClient/Sources/MacMenuBarSemanticState.swift
      - path: MacClient/Sources/SessionControlBarLayout.swift

schemes:
  ScreenHarborHost:
    build:
      targets:
        ScreenHarborHost: all
    run:
      config: Debug
    archive:
      config: Release

  ScreenHarborClient:
    build:
      targets:
        ScreenHarborClient: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - ScreenHarborTests
