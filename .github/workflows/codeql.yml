name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    permissions:
      contents: read
      security-events: write
    runs-on: macos-26-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: c-cpp
            build-mode: none
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Install XcodeGen
        if: matrix.build-mode == 'manual'
        run: brew install xcodegen

      - name: Install Metal toolchain
        if: matrix.build-mode == 'manual'
        run: |
          metal_download_dir="$RUNNER_TEMP/metal-toolchain"
          mkdir -p "$metal_download_dir"
          sudo xcodebuild \
            -downloadComponent MetalToolchain \
            -exportPath "$metal_download_dir"
          sudo chown -R "$(id -u):$(id -g)" "$metal_download_dir"

          metal_dmg="$(find "$metal_download_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$metal_dmg"
          xcodebuild -importComponent MetalToolchain "$metal_dmg"
          xcodebuild -showComponent MetalToolchain
          xcrun --find metal
          xcrun metal --version

      - name: Generate Xcode project
        if: matrix.build-mode == 'manual'
        run: xcodegen generate --spec screenharbor-project.yml

      - name: Resolve app dependencies
        if: matrix.build-mode == 'manual'
        run: >-
          xcodebuild
          -resolvePackageDependencies
          -project ScreenHarbor.xcodeproj

      - name: Build Swift app targets
        if: matrix.build-mode == 'manual'
        run: |
          xcodebuild \
            -project ScreenHarbor.xcodeproj \
            -scheme ScreenHarborHost \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project ScreenHarbor.xcodeproj \
            -scheme ScreenHarborClient \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project ScreenHarbor.xcodeproj \
            -scheme ScreenHarborIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: /language:${{ matrix.language }}
