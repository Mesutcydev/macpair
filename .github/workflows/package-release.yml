name: Package release

on:
  push:
    tags:
      # Legacy MacPair releases use numeric SemVer tags such as v1.0.5.
      # Vamp Suite and Vamp Terminal tags have their own release paths.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package (e.g. v1.0.5)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Mac Host and Client
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" == v* ]] || { echo "Tag must start with v"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          # GitHub's macOS runner can have an unrelated, untrusted AWS tap
          # preinstalled. It is not needed for XcodeGen and otherwise blocks
          # the legacy MacPair packaging job before the build starts.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Package Host and Client
        run: scripts/package-screenharbor.sh all --format both --clean --release

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          files=(dist/MacPair-*.dmg dist/MacPair-*.zip
                 dist/MacPair-*.dmg.sha256 dist/MacPair-*.zip.sha256
                 dist/MacPair-*.dmg.manifest.json dist/MacPair-*.zip.manifest.json
                 dist/MacPair-*.dmg.sbom.cdx.json dist/MacPair-*.zip.sbom.cdx.json)
          [[ ${#files[@]} -gt 0 ]] || { echo "No packaged artifacts in dist/"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "MacPair ${TAG#v} — Open-Source Mac Remote Desktop" \
              --notes-file CHANGELOG.md \
              --latest
          fi
          echo "Uploaded ${#files[@]} files to $TAG"
