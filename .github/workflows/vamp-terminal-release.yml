name: Vamp Terminal release

on:
  push:
    tags:
      - 'vamp-terminal-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Vamp Terminal release tag (e.g. vamp-terminal-1.0.0-build-4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vamp-terminal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Vamp Terminal and hosts
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" == vamp-terminal-* ]] || { echo "Tag must start with vamp-terminal-"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Run core tests
        # Never package a release from a tag whose tests do not pass.
        run: swift test

      - name: Run Linux host tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

      - name: Run browser VT regression
        run: node Tests/BrowserTerminalVTTests.mjs

      - name: Run Linux browser Chat regression
        run: node Tests/LinuxBrowserChatTests.mjs

      - name: Build unsigned AltStore IPA
        run: scripts/package-vamp-terminal-ios.sh --clean

      - name: Upload Vamp Terminal release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          files=(dist/VampTerminal/*.ipa*)
          [[ ${#files[@]} -gt 0 ]] || { echo "No Vamp Terminal artifacts in dist/"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --prerelease \
              --title "Vamp Terminal ${TAG#vamp-terminal-}" \
              --notes "Legacy Vamp Terminal client IPA. Vamp Host, Terminal Host, and Linux Host are discontinued."
          fi
          echo "Uploaded ${#files[@]} Vamp Terminal assets to $TAG"
