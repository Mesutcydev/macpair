name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Swift package dependencies
        # The runner's SwiftPM rewrites Package.resolved's format version, so an
        # exact `git diff` check against it can never pass at the package-root
        # scope. Resolving still fails CI if a pinned dependency is unavailable
        # or incompatible; the app targets' own resolved lockfiles govern the
        # xcodebuild steps below.
        run: swift package resolve

      - name: Run core tests
        run: swift test

      - name: Resolve app dependencies
        run: >-
          xcodebuild
          -resolvePackageDependencies
          -project RemoteDesktopToolApps.xcodeproj

      - name: Build host
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme MacHost
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build terminal-only macOS host
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme VampTerminalHost
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS terminal client
        run: >-
          xcodebuild
          -project RemoteDesktopToolApps.xcodeproj
          -scheme VampTerminalApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
